<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pamukkale Yolculuğu 🚌</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
  }

  #gameWrapper {
    position: relative;
    width: 800px;
    height: 520px;
  }

  canvas {
    display: block;
    border-radius: 16px;
    box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3), 0 8px 10px -6px rgb(0 0 0 / 0.3);
    border: 4px solid #1e293b;
  }

  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }

  .ui-box {
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 8px 16px;
    color: #f8fafc;
    font-family: 'Baloo 2', cursive;
    font-size: 15px;
    font-weight: 600;
    backdrop-filter: blur(8px);
  }

  .ui-box span { color: #f43f5e; font-weight: 800; }

  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.95);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    text-align: center;
    padding: 40px;
  }

  #overlay h1 {
    font-family: 'Baloo 2', cursive;
    font-size: 46px;
    font-weight: 800;
    color: #f8fafc;
    margin-bottom: 12px;
  }

  #overlay .sub {
    font-size: 16px;
    color: #94a3b8;
    margin-bottom: 32px;
    line-height: 1.6;
  }

  #overlay .route-info {
    background: rgba(244, 63, 94, 0.1);
    border: 1px solid rgba(244, 63, 94, 0.3);
    border-radius: 12px;
    padding: 14px 24px;
    color: #e2e8f0;
    font-size: 14px;
    margin-bottom: 32px;
    line-height: 1.8;
    letter-spacing: 0.5px;
  }

  .btn {
    background: linear-gradient(135deg, #e11d48, #be123c);
    border: none;
    border-radius: 50px;
    color: #fff;
    font-family: 'Baloo 2', cursive;
    font-size: 20px;
    font-weight: 800;
    padding: 14px 52px;
    cursor: pointer;
    pointer-events: all;
    box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.5px;
  }
  .btn:hover { transform: scale(1.03); box-shadow: 0 6px 20px rgba(225, 29, 72, 0.4); }
  .btn:active { transform: scale(0.97); }

  #stopBanner {
    position: absolute;
    top: 75px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: linear-gradient(135deg, #e11d48, #be123c);
    border-radius: 50px;
    padding: 10px 32px;
    color: #fff;
    font-family: 'Baloo 2', cursive;
    font-size: 18px;
    font-weight: 800;
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    white-space: nowrap;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
  }
  #stopBanner.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  #itemPopup {
    position: absolute;
    top: 130px;
    left: 50%;
    transform: translateX(-50%) scale(0.5);
    background: #0f172a;
    border: 2px solid #eab308;
    border-radius: 12px;
    padding: 8px 20px;
    color: #facc15;
    font-family: 'Baloo 2', cursive;
    font-size: 16px;
    font-weight: 700;
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    transition: all 0.2s;
    white-space: nowrap;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
  }
  #itemPopup.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }
</style>
</head>
<body>

<div id="gameWrapper">
  <canvas id="gameCanvas" width="800" height="520"></canvas>

  <div id="ui">
    <div class="ui-box">⭐ Puan: <span id="scoreDisplay">0</span></div>
    <div class="ui-box" id="stopDisplay">🚌 Denizli'den başlıyor...</div>
    <div class="ui-box">⏱️ <span id="timerDisplay">5:00</span></div>
  </div>

  <div id="stopBanner">📍 Durak: Denizli</div>
  <div id="itemPopup">+10 Pembe Kalem! ✒️</div>

  <div id="overlay">
    <h1>Pamukkale Yolculuğu</h1>
    <p class="sub">Denizli'den Ankara'ya, anılarla dolu bir yolculuk...</p>
    <div class="route-info">
      📍 Denizli → Dazkırı → Kaptan Mola → Dinar → Sandıklı → Afyon → Polatlı → 🏁 Ankara
    </div>
    <button class="btn" id="startBtn">Ege ile tanış</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ─── STOPS ───
const STOPS = [
  { name: 'Denizli', x: 0 },
  { name: 'Dazkırı', x: 1500 },
  { name: 'Kaptan Mola', x: 3200 },
  { name: 'Dinar', x: 5000 },
  { name: 'Sandıklı', x: 6800 },
  { name: 'Afyon', x: 8800 },
  { name: 'Polatlı', x: 11000 },
  { name: 'Ankara', x: 13500 },
];
const WORLD_END = 14000;

// ─── ITEMS ───
const ITEM_TYPES = [
  { emoji: '✒️', label: 'Pembe Dolma Kalem', color: '#ff69b4', pts: 10 },
  { emoji: '🖱️', label: 'Pembe Mouse', color: '#ff8fc8', pts: 10 },
  { emoji: '📕', label: 'Kırmızı Kitap', color: '#e74c3c', pts: 15 },
  { emoji: '📒', label: 'Sarı Kitap', color: '#f1c40f', pts: 15 },
  { emoji: '⭐', label: 'Yıldızlı Küpe', color: '#ffd700', pts: 20 },
  { emoji: '🐱', label: 'Ankara Magnet', color: '#fff', pts: 25 },
  { emoji: '🦈', label: 'Mavi Peluş', color: '#5bc8f5', pts: 20 },
  { emoji: '🍕', label: 'Pizza', color: '#f39c12', pts: 10 },
  { emoji: '🍝', label: 'Fettuccine Alfredo', color: '#f5cba7', pts: 10 },
  { emoji: '✈️', label: 'Maket Uçak', color: '#85c1e9', pts: 15 },
  { emoji: '🌯', label: 'Tavuk Döner', color: '#e67e22', pts: 10 },
  { emoji: '👕', label: 'Kahverengi T-Shirt', color: '#8b5a2b', pts: 10 },
  { emoji: '💧', label: 'Erikli Su', color: '#3498db', pts: 5 },
];

// ─── GAME STATE ───
let state = 'menu'; // menu | playing | stopped | end
let score = 0;
let busX = 0; // world x
let busLaneOffset = 0; 
let busSpeed = 0;
let cameraX = 0;
let timeLeft = 300; // 5 minutes
let lastTime = 0;
let stopTimer = 0;
let currentStopIdx = 0;
let nextStopIdx = 1;
let atStop = false;
let items = [];
let particles = [];
let bgObjects = [];
let roadCurve = []; 
let clouds = [];
let parallaxMountains = []; 
let busAnim = 0; 
let engineShake = 0;

// ─── GENERATE WORLD ───
function generateWorld() {
  items = [];
  bgObjects = [];
  roadCurve = [];
  clouds = [];
  parallaxMountains = [];

  // Road curve waypoints
  for (let x = 0; x <= WORLD_END + 800; x += 200) {
    roadCurve.push({ x, offset: Math.sin(x * 0.0008) * 60 });
  }

  // Generate artistic layered parallax mountains
  for (let i = 0; i < 60; i++) {
    parallaxMountains.push({
      wx: i * 250 + Math.random() * 80,
      width: 350 + Math.random() * 250,
      height: 70 + Math.random() * 90,
      layer: Math.random() < 0.5 ? 0 : 1 // 0: uzak katman, 1: orta katman
    });
  }

  // Scatter items (avoid stop zones)
  let itemSpacing = WORLD_END / 90;
  for (let i = 0; i < 90; i++) {
    let wx = 300 + i * itemSpacing + (Math.random() - 0.5) * itemSpacing * 0.8;
    let nearStop = STOPS.some(s => Math.abs(s.x - wx) < 300);
    if (nearStop) continue;
    
    let laneOffset = (Math.random() < 0.5 ? -1 : 1) * (15 + Math.random() * 50);
    let type = ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)];
    items.push({ wx, laneOffset, type, collected: false, bobOffset: Math.random() * Math.PI * 2 });
  }

  // Roadside objects tied perfectly to the highway curves
  for (let i = 0; i < 250; i++) {
    let wx = Math.random() * WORLD_END;
    let nearStop = STOPS.some(s => Math.abs(s.x - wx) < 120);
    if (nearStop) continue;

    let side = Math.random() < 0.5 ? -1 : 1;
    let type = Math.random();
    bgObjects.push({ wx, side, type, scale: 0.6 + Math.random() * 0.5 });
  }

  // Clouds
  for (let i = 0; i < 40; i++) {
    clouds.push({
      wx: Math.random() * WORLD_END,
      y: 25 + Math.random() * 75,
      scale: 0.6 + Math.random() * 0.8,
      speed: 0.08 + Math.random() * 0.12
    });
  }
}

function getRoadOffset(wx) {
  let i = 0;
  while (i < roadCurve.length - 1 && roadCurve[i + 1].x < wx) i++;
  let a = roadCurve[i], b = roadCurve[i + 1] || a;
  let t = b.x === a.x ? 0 : (wx - a.x) / (b.x - a.x);
  return a.offset + (b.offset - a.offset) * t;
}

// ─── INPUT ───
const keys = {};
window.addEventListener('keydown', e => { 
  keys[e.code] = true; 
  if(['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) e.preventDefault(); 
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ─── STOP BANNER ───
const stopBanner = document.getElementById('stopBanner');
const itemPopup = document.getElementById('itemPopup');
const scoreDisplay = document.getElementById('scoreDisplay');
const stopDisplay = document.getElementById('stopDisplay');
const timerDisplay = document.getElementById('timerDisplay');

function showStopBanner(name) {
  stopBanner.textContent = '📍 Durak: ' + name;
  stopBanner.classList.add('show');
  setTimeout(() => stopBanner.classList.remove('show'), 2500);
}

function showItemPopup(label, pts) {
  itemPopup.textContent = '+' + pts + ' ' + label + '!';
  itemPopup.classList.add('show');
  clearTimeout(itemPopup._t);
  itemPopup._t = setTimeout(() => itemPopup.classList.remove('show'), 1000);
}

// ─── PARTICLES ───
function spawnParticles(sx, sy, color) {
  for (let i = 0; i < 8; i++) {
    let angle = Math.random() * Math.PI * 2;
    let speed = 2 + Math.random() * 3;
    particles.push({
      x: sx, y: sy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      color,
      life: 1,
      size: 4 + Math.random() * 4
    });
  }
}

// ─── DRAW FUNCTIONS ───

function drawSky() {
  let grad = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  let progress = busX / WORLD_END;
  let r1 = Math.round(140 - progress * 25);
  let g1 = Math.round(185 - progress * 20);
  let b1 = Math.round(230 - progress * 10);
  grad.addColorStop(0, `rgb(${r1},${g1},${b1})`);
  grad.addColorStop(1, '#f1f5f9');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H * 0.55);
}

function drawParallaxMountains() {
  // Arka Plan Dağ Katmanları (Gerçekçi paralaks derinliği için)
  for (let layer = 0; layer < 2; layer++) {
    ctx.fillStyle = layer === 0 ? '#cbd5e1' : '#94a3b8';
    let scrollFactor = layer === 0 ? 0.12 : 0.25; 

    parallaxMountains.forEach(m => {
      if (m.layer !== layer) return;
      let sx = m.wx - cameraX * scrollFactor;
      // Sonsuz döngü simülasyonu
      if (sx < -m.width) sx += WORLD_END;
      
      let sy = H * 0.51;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + m.width / 2, sy - m.height);
      ctx.lineTo(sx + m.width, sy);
      ctx.closePath();
      ctx.fill();
    });
  }
}

function drawGround() {
  let grad = ctx.createLinearGradient(0, H * 0.5, 0, H);
  grad.addColorStop(0, '#475569'); 
  grad.addColorStop(0.05, '#22c55e');
  grad.addColorStop(0.5, '#16a34a');
  grad.addColorStop(1, '#15803d');
  ctx.fillStyle = grad;
  ctx.fillRect(0, H * 0.5, W, H * 0.5);
}

function drawClouds(dt) {
  clouds.forEach(c => {
    c.wx -= c.speed * dt * 30;
    if (c.wx < -200) c.wx = WORLD_END + 200;
    let sx = c.wx - cameraX * 0.4;
    if (sx < -200 || sx > W + 200) return;
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#ffffff';
    let cx = sx, cy = c.y;
    let r = 24 * c.scale;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.arc(cx + r * 0.8, cy - r * 0.3, r * 0.75, 0, Math.PI * 2);
    ctx.arc(cx + r * 1.6, cy, r * 0.85, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawRoad() {
  ctx.save();
  const ROAD_W = 180;

  ctx.beginPath();
  let started = false;
  for (let wx = cameraX - 20; wx <= cameraX + W + 20; wx += 8) {
    let sx = wx - cameraX;
    let cy = H / 2 + getRoadOffset(wx);
    if (!started) { ctx.moveTo(sx, cy - ROAD_W / 2); started = true; }
    else ctx.lineTo(sx, cy - ROAD_W / 2);
  }
  for (let wx = cameraX + W + 20; wx >= cameraX - 20; wx -= 8) {
    let sx = wx - cameraX;
    let cy = H / 2 + getRoadOffset(wx);
    ctx.lineTo(sx, cy + ROAD_W / 2);
  }
  ctx.closePath();
  ctx.fillStyle = '#334155';
  ctx.fill();

  // Emniyet Şeritleri (Beyaz)
  [-1, 1].forEach(side => {
    ctx.beginPath();
    let s2 = false;
    for (let wx = cameraX - 20; wx <= cameraX + W + 20; wx += 8) {
      let sx = wx - cameraX;
      let cy = H / 2 + getRoadOffset(wx) + side * (ROAD_W / 2 - 6);
      if (!s2) { ctx.moveTo(sx, cy - 2); s2 = true; }
      else ctx.lineTo(sx, cy - 2);
    }
    for (let wx = cameraX + W + 20; wx >= cameraX - 20; wx -= 8) {
      let sx = wx - cameraX;
      let cy = H / 2 + getRoadOffset(wx) + side * (ROAD_W / 2 - 6);
      ctx.lineTo(sx, cy + 2);
    }
    ctx.closePath();
    ctx.fillStyle = '#cbd5e1';
    ctx.fill();
  });

  // Yol Kesik Çizgileri
  ctx.setLineDash([25, 20]);
  ctx.strokeStyle = '#fef08a';
  ctx.lineWidth = 3;
  ctx.beginPath();
  let fd = false;
  for (let wx = cameraX - 20; wx <= cameraX + W + 20; wx += 6) {
    let sx = wx - cameraX;
    let cy = H / 2 + getRoadOffset(wx);
    if (!fd) { ctx.moveTo(sx, cy); fd = true; } else ctx.lineTo(sx, cy);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawBGObjects() {
  bgObjects.forEach(obj => {
    let sx = obj.wx - cameraX;
    if (sx < -60 || sx > W + 60) return;
    
    let roadY = H / 2 + getRoadOffset(obj.wx);
    let sy = roadY + obj.side * (110 + Math.random() * 10);

    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(obj.scale, obj.scale);
    
    if (obj.type < 0.4) {
      // Ağaçlar
      ctx.fillStyle = '#78350f';
      ctx.fillRect(-3, -15, 6, 18);
      ctx.fillStyle = '#15803d';
      ctx.beginPath();
      ctx.arc(0, -22, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#16a34a';
      ctx.beginPath();
      ctx.arc(0, -30, 11, 0, Math.PI * 2);
      ctx.fill();
    } else if (obj.type < 0.75) {
      // Çalılar
      ctx.fillStyle = '#166534';
      ctx.beginPath();
      ctx.arc(0, -6, 11, 0, Math.PI * 2);
      ctx.arc(8, -5, 8, 0, Math.PI * 2);
      ctx.arc(-8, -4, 9, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Elektrik Direği
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, -45);
      ctx.lineTo(0, 10);
      ctx.stroke();
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-12, -34);
      ctx.lineTo(12, -34);
      ctx.stroke();
      // Teller
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(-12, -33);
      ctx.quadraticCurveTo(0, -26, 12, -33);
      ctx.stroke();
    }
    ctx.restore();
  });
}

function drawStopSign(stopObj) {
  let sx = stopObj.x - cameraX;
  if (sx < -100 || sx > W + 100) return;
  let roadY = H / 2 + getRoadOffset(stopObj.x);
  ctx.save();
  ctx.translate(sx, roadY - 95);
  
  // Tabela Direği
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 65);
  ctx.stroke();
  
  // Tabela Gövdesi
  ctx.fillStyle = '#e11d48';
  ctx.beginPath();
  ctx.roundRect(-30, -26, 60, 26, 6);
  ctx.fill();
  
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px Nunito';
  ctx.textAlign = 'center';
  ctx.fillText(stopObj.name, 0, -10);
  ctx.restore();
}

function drawBus() {
  let busRoadY = H / 2 + getRoadOffset(busX);
  let sx = W / 2 + (atStop ? 0 : engineShake * (Math.random() - 0.5));
  let sy = busRoadY + busLaneOffset;

  busAnim += 0.15;

  ctx.save();
  ctx.translate(sx, sy);

  // Gölge
  ctx.save();
  ctx.globalAlpha = 0.2;
  ctx.fillStyle = '#000';
  ctx.scale(1, 0.3);
  ctx.beginPath();
  ctx.ellipse(0, 10, 60, 18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Otobüs Gövdesi
  const BW = 110, BH = 48;
  
  // Beyaz Orta Kısım
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.roundRect(-BW / 2, -BH / 2 - 8, BW, BH, 10);
  ctx.fill();

  // Üst Kırmızı Kuşak
  ctx.fillStyle = '#e11d48';
  ctx.beginPath();
  ctx.roundRect(-BW / 2, -BH / 2 - 8, BW, 14, [10, 10, 0, 0]);
  ctx.fill();

  // Alt Kırmızı Kuşak
  ctx.fillStyle = '#e11d48';
  ctx.fillRect(-BW / 2, BH / 2 - 16, BW, 8);

  // Camlar
  ctx.fillStyle = 'rgba(186, 230, 253, 0.9)';
  for (let i = 0; i < 5; i++) {
    let wx = -BW / 2 + 14 + i * 19;
    ctx.beginPath();
    ctx.roundRect(wx, -BH / 2 + 0, 14, 16, 3);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(wx + 2, -BH / 2 + 2, 4, 6);
    ctx.fillStyle = 'rgba(186, 230, 253, 0.9)';
  }

  // Ön Cam
  ctx.fillStyle = 'rgba(186, 230, 253, 0.8)';
  ctx.beginPath();
  ctx.roundRect(BW / 2 - 20, -BH / 2 + 2, 16, 20, 3);
  ctx.fill();

  ctx.fillStyle = '#e11d48';
  ctx.font = 'bold 7.5px "Baloo 2", cursive';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('PAMUKKALE', 0, -2); 

  // Jumbo logosu
  ctx.fillStyle = '#334155';
  ctx.font = 'bold 6px Nunito';
  ctx.fillText('Jumbo', -22, 6);

  // Farlar
  ctx.fillStyle = '#fef08a';
  ctx.beginPath();
  ctx.ellipse(BW / 2 - 5, BH / 2 - 28, 5, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(BW / 2 - 5, -BH / 2 + 16, 5, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Tekerlekler
  [[-32, BH / 2], [-32 + 20, BH / 2], [32, BH / 2], [32 - 20, BH / 2]].forEach(([wx, wy], i) => {
    let angle = busAnim + i * 0.3;
    ctx.save();
    ctx.translate(wx, wy - 2);
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(0, 0, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#94a3b8';
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 1.5;
    for (let s = 0; s < 4; s++) {
      let a2 = angle + s * Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a2) * 4, Math.sin(a2) * 4);
      ctx.stroke();
    }
    ctx.restore();
  });

  // Egzoz Dumanı
  if (busSpeed > 1) {
    ctx.globalAlpha = 0.25 * (busSpeed / 5);
    ctx.fillStyle = '#cbd5e1';
    let px = -BW / 2 - 8;
    for (let i = 0; i < 3; i++) {
      let r = 4 + i * 3;
      ctx.beginPath();
      ctx.arc(px - i * 8, 0, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawItems(t) {
  items.forEach(item => {
    if (item.collected) return;
    let sx = item.wx - cameraX;
    if (sx < -40 || sx > W + 40) return;
    
    let roadY = H / 2 + getRoadOffset(item.wx);
    let sy = roadY + item.laneOffset + Math.sin(t * 2 + item.bobOffset) * 6;
    
    // Glow efekti
    ctx.save();
    ctx.globalAlpha = 0.25;
    let grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, 26);
    grd.addColorStop(0, item.type.color);
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(sx, sy, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Emoji
    ctx.font = '24px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.type.emoji, sx, sy);
  });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawHorizon() {
  let grad = ctx.createLinearGradient(0, H * 0.49, 0, H * 0.54);
  grad.addColorStop(0, 'rgba(241,245,249,0)');
  grad.addColorStop(0.5, 'rgba(71,85,105,0.2)');
  grad.addColorStop(1, 'rgba(34,197,94,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, H * 0.49, W, H * 0.05);
}

function drawProgressBar() {
  let progress = busX / WORLD_END;
  let barW = W - 40;
  ctx.fillStyle = 'rgba(15, 23, 42, 0.3)';
  ctx.beginPath();
  ctx.roundRect(20, H - 24, barW, 10, 5);
  ctx.fill();

  ctx.fillStyle = '#e11d48';
  ctx.beginPath();
  ctx.roundRect(20, H - 24, barW * progress, 10, 5);
  ctx.fill();

  STOPS.forEach((s, i) => {
    let px = 20 + (s.x / WORLD_END) * barW;
    ctx.fillStyle = i < nextStopIdx ? '#94a3b8' : '#ffffff';
    ctx.beginPath();
    ctx.arc(px, H - 19, 4, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ─── COLLISION ───
function checkCollisions() {
  let busActualY = (H / 2 + getRoadOffset(busX)) + busLaneOffset;

  items.forEach(item => {
    if (item.collected) return;
    let dx = item.wx - busX;
    let itemActualY = (H / 2 + getRoadOffset(item.wx)) + item.laneOffset;
    let dy = itemActualY - busActualY;

    if (Math.abs(dx) < 45 && Math.abs(dy) < 40) {
      item.collected = true;
      score += item.type.pts;
      scoreDisplay.textContent = score;
      let sx = W / 2;
      spawnParticles(sx, H / 2, item.type.color);
      showItemPopup(item.type.emoji + ' ' + item.type.label, item.type.pts);
    }
  });
}

function checkStops() {
  if (nextStopIdx >= STOPS.length) return;
  let nextStop = STOPS[nextStopIdx];
  let dist = nextStop.x - busX;
  if (dist <= 0 && !atStop) {
    atStop = true;
    stopTimer = 2.5;
    state = 'stopped';
    showStopBanner(nextStop.name);
    stopDisplay.textContent = '📍 ' + nextStop.name;
    currentStopIdx = nextStopIdx;
    nextStopIdx++;
    busSpeed = 0;
    if (currentStopIdx === STOPS.length - 1) {
      setTimeout(() => showEndScreen(), 2000);
    }
  }
}

// ─── END SCREEN ───
function showEndScreen() {
  state = 'end';
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = `
    <div style="font-size:52px;margin-bottom:8px">🎉</div>
    <h1 style="font-size:32px;margin-bottom:12px">Ankara'ya Vardık!</h1>
    <div style="background:rgba(225,29,72,0.1);border:1px solid rgba(225,29,72,0.3);border-radius:12px;padding:20px 28px;color:#f8fafc;font-size:15px;line-height:2;margin-bottom:20px;">
      ⭐ Toplam Puan: <strong style="color:#eab308;font-size:22px">${score}</strong><br>
      🚌 Tüm duraklar başarıyla tamamlandı!
    </div>
    <div style="background:rgba(244,63,94,0.08);border:1px solid rgba(244,63,94,0.25);border-radius:16px;padding:22px 30px;max-width:420px;color:#fff;font-size:15px;line-height:1.9;margin-bottom:24px;">
      💌 <em>Pamukkale'de başlayan yolculuk, her zaman devam eder.<br>
      2. ayın kutlu olsun — bu yolda seninle olmak güzel. 🐱🦈</em>
    </div>
    <button class="btn" onclick="location.reload()">YENİDEN OYNA 🚌</button>
  `;
  overlay.style.display = 'flex';
}

// ─── UPDATE ───
function update(dt) {
  if (state === 'stopped') {
    stopTimer -= dt;
    if (stopTimer <= 0) {
      atStop = false;
      state = 'playing';
      if (currentStopIdx === STOPS.length - 1) return;
    }
    return;
  }
  if (state !== 'playing') return;

  // Timer
  timeLeft -= dt;
  if (timeLeft < 0) timeLeft = 0;
  let m = Math.floor(timeLeft / 60);
  let s2 = Math.floor(timeLeft % 60);
  timerDisplay.textContent = m + ':' + String(s2).padStart(2, '0');

  // Kontroller (D: Gaz, A: Fren)
  const MAX_SPEED = 5;
  if (keys['KeyD']) {
    busSpeed = Math.min(busSpeed + 0.12, MAX_SPEED);
    engineShake = 1;
  } else if (keys['KeyA']) {
    busSpeed = Math.max(busSpeed - 0.18, 0);
    engineShake = 0;
  } else {
    if (busSpeed > 1.5) busSpeed = Math.max(busSpeed - 0.04, 1.5);
    else if (busSpeed < 1.5) busSpeed = Math.min(busSpeed + 0.04, 1.5);
    engineShake = 0.3;
  }

  // Kontroller (W: Yukarı şerit, S: Aşağı şerit)
  const LANE_SPEED = 200 * dt;
  if (keys['KeyW']) {
    busLaneOffset -= LANE_SPEED;
  }
  if (keys['KeyS']) {
    busLaneOffset += LANE_SPEED;
  }
  busLaneOffset = Math.max(-70, Math.min(70, busLaneOffset));

  // Durak yavaşlaması (Zeno Paradoksu Çözümü)
  if (nextStopIdx < STOPS.length) {
    let distToStop = STOPS[nextStopIdx].x - busX;
    if (distToStop < 150 && distToStop > 0) {
      busSpeed = Math.min(busSpeed, Math.max(0.8, distToStop / 30));
    }
  }

  busX += busSpeed;
  if (busX > WORLD_END) busX = WORLD_END;

  cameraX = busX - W / 2;

  checkCollisions();
  checkStops();

  // Particles
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.03;
  });
  particles = particles.filter(p => p.life > 0);
}

// ─── RENDER ───
function render(t) {
  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawParallaxMountains(); 
  drawGround();
  drawClouds(0.016);
  drawHorizon();
  drawBGObjects();
  drawRoad();
  STOPS.forEach(drawStopSign);
  drawItems(t / 1000);
  drawBus();
  drawParticles();
  drawProgressBar();
}

// ─── LOOP ───
function loop(ts) {
  let dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  update(dt);
  render(ts);
  requestAnimationFrame(loop);
}

// ─── START ───
document.getElementById('startBtn').addEventListener('click', () => {
  generateWorld();
  state = 'playing';
  busX = 0;
  busLaneOffset = 0; 
  cameraX = -W / 2;
  busSpeed = 1.5;
  score = 0;
  timeLeft = 300;
  currentStopIdx = 0;
  nextStopIdx = 1;
  atStop = false;
  scoreDisplay.textContent = '0';
  stopDisplay.textContent = '🚌 Denizli → Ankara';
  // Hata düzeltildi: style.style.display yerine style.display
  document.getElementById('overlay').style.display = 'none';
  requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
});
</script>
</body>
